<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinkedIn cover 2400x1200. MARSYNC palette + space theme.
  Right block: headline + grid/pixels (reference: bold caps tagline, digital grid).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200">
  <defs>
    <radialGradient id="nebula" cx="72%" cy="28%" r="55%">
      <stop offset="0%" style="stop-color:#8b2e1b;stop-opacity:0.35"/>
      <stop offset="35%" style="stop-color:#3d3933;stop-opacity:0.25"/>
      <stop offset="70%" style="stop-color:#161512;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#161512;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowCore" cx="78%" cy="22%" r="12%">
      <stop offset="0%" style="stop-color:#f2efe8;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#e8e4da;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b2e1b;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#161512"/>
      <stop offset="38%" style="stop-color:#2a2622"/>
      <stop offset="68%" style="stop-color:#4a4038"/>
      <stop offset="100%" style="stop-color:#f2efe8"/>
    </linearGradient>
    <linearGradient id="planet">
      <stop offset="0%" style="stop-color:#8b2e1b"/>
      <stop offset="70%" style="stop-color:#6f2415"/>
      <stop offset="100%" style="stop-color:#161512"/>
    </linearGradient>
    <pattern id="rightGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8b2e1b" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <clipPath id="rightHalf">
      <rect x="1180" y="0" width="1220" height="1200"/>
    </clipPath>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@700&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap");
      .headline {
        font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", Arial, sans-serif;
        font-weight: 700;
        font-size: 86px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        fill: #f2efe8;
      }
      .headlineAccent {
        fill: #8b2e1b;
      }
      .logo {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 112px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .tag {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        fill: #c9c2b4;
      }
      .sub {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 30px;
        fill: #9aa3b2;
      }
    </style>
  </defs>
  <rect width="2400" height="1200" fill="url(#sky)"/>
  <rect width="2400" height="1200" fill="url(#nebula)"/>
  <ellipse cx="1870" cy="280" rx="380" ry="220" fill="url(#glowCore)" opacity="0.85" transform="rotate(-18 1870 280)"/>
  <circle cx="1780" cy="340" r="95" fill="url(#planet)" opacity="0.92"/>
  <circle cx="1780" cy="340" r="102" fill="none" stroke="#f2efe8" stroke-width="1.5" opacity="0.25"/>
  <ellipse cx="1780" cy="340" rx="200" ry="48" fill="none" stroke="#8b2e1b" stroke-width="2" opacity="0.35" transform="rotate(-12 1780 340)"/>
  <ellipse cx="1780" cy="340" rx="280" ry="72" fill="none" stroke="#f2efe8" stroke-width="1" opacity="0.12" transform="rotate(8 1780 340)"/>
  <g fill="#f2efe8" opacity="0.9">
    <circle cx="320" cy="180" r="1.8"/><circle cx="450" cy="95" r="1.2"/><circle cx="890" cy="220" r="1.5"/><circle cx="1200" cy="140" r="1"/><circle cx="1350" cy="280" r="1.4"/>
    <circle cx="200" cy="420" r="1"/><circle cx="580" cy="380" r="1.6"/><circle cx="1020" cy="60" r="1.1"/><circle cx="1480" cy="200" r="1.3"/><circle cx="400" cy="520" r="0.9"/>
    <circle cx="2100" cy="520" r="1.2"/><circle cx="2200" cy="180" r="1"/><circle cx="1600" cy="80" r="1.5"/><circle cx="700" cy="650" r="1"/><circle cx="1900" cy="900" r="1.1"/>
  </g>
  <g fill="#e8e4da" opacity="0.5">
    <circle cx="380" cy="300" r="0.8"/><circle cx="920" cy="480" r="0.7"/><circle cx="1300" cy="400" r="0.9"/><circle cx="500" cy="720" r="0.6"/><circle cx="1100" cy="620" r="0.8"/>
  </g>
  <!-- Right zone: blueprint grid + pixel field (brand colors, not KPMG blue) -->
  <g clip-path="url(#rightHalf)">
    <rect x="1180" y="0" width="1220" height="1200" fill="url(#rightGrid)" opacity="0.85"/>
    <rect x="1180" y="0" width="1220" height="1200" fill="#161512" opacity="0.12"/>
  </g>
  <g opacity="0.85">
    <rect x="1940" y="180" width="14" height="14" fill="#8b2e1b"/><rect x="1988" y="156" width="22" height="22" fill="#f2efe8"/>
    <rect x="2260" y="240" width="18" height="18" fill="#8b2e1b"/><rect x="2310" y="268" width="12" height="12" fill="#3d3933"/>
    <rect x="2180" y="320" width="28" height="28" fill="#f2efe8" opacity="0.35"/><rect x="2228" y="360" width="16" height="16" fill="#8b2e1b"/>
    <rect x="2080" y="400" width="10" height="10" fill="#f2efe8"/><rect x="2288" y="420" width="20" height="20" fill="#8b2e1b" opacity="0.7"/>
    <rect x="2140" y="480" width="14" height="14" fill="#6b655b"/><rect x="2330" y="500" width="12" height="12" fill="#f2efe8"/>
    <rect x="2000" y="560" width="24" height="24" fill="#8b2e1b" opacity="0.5"/><rect x="2290" y="600" width="18" height="18" fill="#f2efe8" opacity="0.25"/>
    <rect x="2060" y="640" width="16" height="16" fill="#f2efe8"/><rect x="2240" y="680" width="12" height="12" fill="#8b2e1b"/>
    <rect x="2320" y="720" width="14" height="14" fill="#3d3933"/><rect x="1960" y="760" width="20" height="20" fill="#8b2e1b" opacity="0.4"/>
  </g>
  <line x1="1720" y1="380" x2="1720" y2="820" stroke="#8b2e1b" stroke-width="3" opacity="0.55"/>
  <!-- Headline: right-aligned, two lines -->
  <text x="2336" y="520" class="headline" text-anchor="end">Precision <tspan class="headlineAccent">AI.</tspan></text>
  <text x="2336" y="630" class="headline" text-anchor="end">Zero <tspan class="headlineAccent">compromise.</tspan></text>
  <line x1="1880" y1="668" x2="2336" y2="668" stroke="#f2efe8" stroke-width="2" opacity="0.35"/>
  <path d="M 0 1180 Q 600 1050 1200 1120 T 2400 1080 L 2400 1200 L 0 1200 Z" fill="#161512" opacity="0.35"/>
  <line x1="96" y1="1088" x2="720" y2="1088" stroke="#8b2e1b" stroke-width="8" opacity="0.95"/>
  <text x="96" y="920" class="tag">Implementation · Orlando &amp; Lake Nona</text>
  <text x="96" y="980" class="sub">Practical AI for Central Florida</text>
  <text x="96" y="1120" class="logo">
    <tspan fill="#f2efe8">MAR</tspan><tspan fill="#8b2e1b">SYNC</tspan>
  </text>
</svg>
