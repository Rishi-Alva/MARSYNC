<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MARSYNC wordmark 4K export</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 3840px;
        height: 2160px;
        background: #f2efe8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "IBM Plex Sans", sans-serif;
      }
      .logo {
        font-weight: 700;
        font-size: 340px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #161512;
        white-space: nowrap;
      }
      .logo span {
        color: #8b2e1b;
      }
    </style>
  </head>
  <body>
    <div class="logo">MAR<span>SYNC</span></div>
  </body>
</html>
