<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact MARSYNC: AI assessments and implementation for Lake Nona, Orlando, and Central Florida."
    />
    <title>Contact | MARSYNC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="logo" href="index.html">MAR<span>SYNC</span></a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          Menu
        </button>
        <nav class="site-nav" id="primary-nav" aria-label="Primary">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="wrap page-hero">
        <p class="section-label">Contact</p>
        <h1>Let’s talk</h1>
        <p>
          Share a bit about your business and what you want to improve. We typically reply
          within one business day.
        </p>
      </div>

      <section>
        <div class="wrap">
          <p class="muted" style="max-width: 52ch; margin-top: 0">
            Prefer email?
            <a id="contact-email-link" href="#">Loading…</a>
          </p>

          <form id="contact-form" class="form-grid" novalidate>
            <div class="hp" aria-hidden="true">
              <label for="website">Website</label>
              <input id="website" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
            </div>
            <div>
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required autocomplete="name" />
            </div>
            <div>
              <label for="company">Company</label>
              <input id="company" name="company" type="text" autocomplete="organization" />
            </div>
            <div>
              <label for="email">Work email</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div>
              <label for="message">What should we know?</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Send message</button>
            <p id="form-status" class="form-status" hidden role="status"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div>
          <div class="footer-brand">MARSYNC</div>
          <div>Implementation &amp; Advisory · Orlando &amp; Lake Nona</div>
        </div>
        <div class="footer-meta">
          <a href="index.html">Home</a>
          ·
          <span id="footer-year"></span>
          MARSYNC
        </div>
      </div>
    </footer>

    <script src="js/site-config.js"></script>
    <script>
      (function () {
        var S = window.SITE || {};
        document.getElementById("footer-year").textContent = new Date().getFullYear();
        var email = S.email || "";
        var el = document.getElementById("contact-email-link");
        el.textContent = email || "Configure email in site-config.js";
        el.href = email ? "mailto:" + email : "#";
      })();
    </script>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
