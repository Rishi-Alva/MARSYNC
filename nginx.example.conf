# Example server block: copy paths to match your server.
# Place site files in /var/www/marsync (or adjust root).

server {
    listen 80;
    server_name marsync.com www.marsync.com;
    root /var/www/marsync;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: long cache for static assets (adjust after deploy workflow)
    location ~* \.(css|js|woff2?|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
